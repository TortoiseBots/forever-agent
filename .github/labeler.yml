# Path and branch rules for actions/labeler (.github/workflows/label-pr.yml).
#
# labeler only ADDS labels: a label a person removed comes back only when a rule matches again, and the workflow keeps
# `sync-labels: false` so nothing is ever removed.
#
# The vocabulary is minimatch: `*` never crosses `/`, `**/` matches zero or more directories. A pattern without a
# leading `**/` is anchored at the repository root. `head-branch` is a list of regular expressions on the branch name.
#
# tools/label_issue.py --backfill reads this same file (the changed-file globs and the branch regexes), so a path rule
# lives here only and the backfill cannot drift from the action.
#
# `any:` ORs its matchers; a plain list of matchers ANDs them.

bug:
  - head-branch: ["^fix/"]

enhancement:
  - head-branch: ["^feat/"]

documentation:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "docs/**"
              - "**/*.md"
      - head-branch: ["^docs/"]

data:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "data/**"
      - head-branch: ["^data/"]

ci:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - ".github/**"
              - "Makefile"
              - "scripts/**"
      - head-branch: ["^ci/"]

