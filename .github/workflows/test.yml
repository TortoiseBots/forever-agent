name: test

# Gate for dev and main: every PR (to dev, main or a stacked feature branch) and every push runs the
# job `test`; branch protection on dev and main requires it. A push to a ci/** branch runs it too, so a worker can
# run the full CI without a PR (docs/CI.md).
on:
  push:
    branches: [main, dev, "ci/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Draft PRs are work in progress; CI runs when the PR is marked ready.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Go version comes from go.mod. The repo has no dependencies and so no go.sum,
      # so the module and build cache is keyed on go.mod instead.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      # The Makefile defaults to a Go under $HOME/.local/go; point it at the runner's Go.
      # fmt-check, vet and `go test -race` need no secrets: the tests use fakes and the
      # committed, scrubbed fixtures.
      - name: gofmt, go vet, no-cgo build, go test -race
        run: make GOROOT_LOCAL="$(go env GOROOT)" fmt-check vet test

      # Pinned: a new staticcheck release must not turn an unrelated PR red. No checks are disabled; a false positive
      # is a single `-check` in a commented staticcheck.conf, never a whole category.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # `make test` builds the navmesh engine through cgo (the runner has g++) and runs the navmesh tests, which
      # skip without mmaps. This builds the real binary with cgo explicitly.
      - name: cgo build
        run: CGO_ENABLED=1 make GOROOT_LOCAL="$(go env GOROOT)" build

  # The Go scorers against the Python reference on the hand-made differential table. The reference is a public
  # repository checked out at the pinned commit; no secret is involved. A missing reference makes the tests SKIP, so
  # this job greps its own verbose output and fails on a skip: the table cannot go green without Python.
  differential:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: TortoiseBots/tortoise-trials
          ref: 645642c8a1d4e82ace5bf64056c8b295e91b7e3a
          path: .reference/tortoise-trials
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: differential table against the pinned reference
        run: |
          set -euo pipefail
          out="$(TRIALS_PYTHON_ROOT="$PWD/.reference/tortoise-trials" go test -count=1 -v ./internal/trials/tests/differential 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if grep -q -- "--- SKIP" <<<"$out"; then
            echo "differential tests skipped; a reference that is absent must fail this job" >&2
            exit 1
          fi
          if grep -q -- "--- FAIL" <<<"$out"; then
            exit 1
          fi
