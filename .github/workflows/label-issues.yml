name: label-issues

# Keyword labels on the title and body of an issue (the rules are in tools/label_issue.py). The script reads both from
# environment variables, never interpolated into the shell, so a title or body that looks like shell syntax is only
# text and cannot run anything.
#
# It runs ONCE, when the issue opens: keyword labels describe the text at that moment. A later edit does not re-add a
# label a person removed, and does not chase the labels the new text no longer matches; a person's correction stands.
#
# The script only ADDS labels from its own table: the people-owned labels (the priority labels, TortoiseBots) are never
# touched.
#
# `contents: read` is for checking out the script itself from the default branch (sparse: just that file); the issue text
# is never code. `issues: write` is the only write permission. The action is pinned to a full commit SHA (the version in
# the comment); a new version comes in a reviewed PR that updates both.
on:
  issues:
    types: [opened]

concurrency:
  group: label-issues-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/label_issue.py
          sparse-checkout-cone-mode: false

      - name: label the issue by its title and body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 -I tools/label_issue.py
